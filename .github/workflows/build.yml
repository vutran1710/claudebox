name: Build

# Every push and every pull request, because the failure this exists for is
# invisible to a developer: a commit that does not contain what their working
# tree does. `git commit --only` once left two deleted files in the tree, and
# main stopped compiling while every local build and test still passed.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # One definition of the toolchain, shared with release.yml.
          go-version-file: go.mod

      # A clean checkout is the whole point. Nothing here may depend on a file
      # that exists only on somebody's machine.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Formatted
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      # The release builds four targets from a Mac with CGO off. A build that
      # only works on the runner's own platform would pass everything above and
      # fail at tag time, which is the worst moment to find out.
      - name: Cross-compile the release targets
        run: |
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/cbx/
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/cbx-setuptool/
              echo "  ok $os/$arch"
            done
          done
