name: Release cbx

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read from go.mod so the toolchain has one definition. Pinned here
          # it drifted: go.mod asked for 1.25.3 while this said 1.24, and
          # releases built only because the toolchain downloaded itself.
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.ref_name }}
        run: |
          # CGO_ENABLED=0 matters: the session store uses a pure-Go SQLite
          # driver, and cgo would make these binaries non-portable and break
          # cross-compilation.
          CGO_ENABLED=0 go build -ldflags "-X main.version=${TAG#v}" -o "cbx-${GOOS}-${GOARCH}" ./cmd/cbx/
          CGO_ENABLED=0 go build -ldflags "-X main.version=${TAG#v}" -o "cbx-setuptool-${GOOS}-${GOARCH}" ./cmd/cbx-setuptool/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            cbx-${{ matrix.goos }}-${{ matrix.goarch }}
            cbx-setuptool-${{ matrix.goos }}-${{ matrix.goarch }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Determine tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          chmod +x cbx-*
          gh release create "$TAG" cbx-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
